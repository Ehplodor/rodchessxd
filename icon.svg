<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Chess Board Accent Grid in background -->
  <rect x="24" y="24" width="40" height="40" fill="#1e293b" opacity="0.4" rx="4"/>
  <rect x="64" y="64" width="40" height="40" fill="#1e293b" opacity="0.4" rx="4"/>

  <!-- AI / Engine Glow Circle -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="8 6" filter="url(#glow)" opacity="0.8"/>
  
  <!-- Modern Geometric Knight Piece -->
  <path d="M42 98 C44 96, 84 96, 86 98 L88 102 C88 104, 40 104, 40 102 Z" fill="url(#goldGrad)"/>
  <path d="M46 94 C46 90, 82 90, 82 94 L85 97 C81 97, 47 97, 43 97 Z" fill="#fef3c7"/>
  <path d="M50 89 C48 76, 42 66, 45 52 C48 38, 59 30, 68 28 C73 34, 75 36, 73 42 C78 40, 81 44, 83 49 C85 54, 82 58, 77 60 C82 66, 83 77, 81 89 Z" fill="url(#goldGrad)"/>
  
  <!-- Knight details (eye, mane) -->
  <circle cx="58" cy="46" r="3.5" fill="#0f172a"/>
  <path d="M68 34 C72 38, 74 46, 70 54" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- RodChessXD spark badge -->
  <circle cx="94" cy="34" r="5" fill="#38bdf8" filter="url(#glow)"/>
</svg>
